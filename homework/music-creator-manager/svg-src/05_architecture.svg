  <g id="out-alert" data-pptx-bounds="900 380 300 110">
    <rect x="900" y="380" width="300" height="110" rx="12" fill="#131C2E" stroke="#263A5E" stroke-width="1"/>
    <use data-icon="tabler-outline/bell" x="924" y="402" width="32" height="32" fill="#F87171"/>
    <text x="972" y="426" font-size="22" font-weight="bold" fill="#E9EFFB">异常预警</text>
    <text x="924" y="468" font-size="16" fill="#64789E">红色事项即时提醒</text>
  </g>

  <g id="out-weekly" data-pptx-bounds="900 520 300 110">
    <rect x="900" y="520" width="300" height="110" rx="12" fill="#131C2E" stroke="#263A5E" stroke-width="1"/>
    <use data-icon="tabler-outline/file-text" x="924" y="542" width="32" height="32" fill="#8A7CFF"/>
    <text x="972" y="566" font-size="22" font-weight="bold" fill="#E9EFFB">自动周报</text>
    <text x="924" y="608" font-size="16" fill="#64789E">周五下班前生成草稿</text>
  </g>

  <g id="footer" data-pptx-bounds="80 664 1120 40">
    <text x="80" y="690" font-size="13" letter-spacing="3" fill="#3E5174">MUSIC CREATOR MANAGER</text>
    <text x="1200" y="690" font-size="13" letter-spacing="2" text-anchor="end" fill="#3E5174">05 / 11</text>
  </g>
