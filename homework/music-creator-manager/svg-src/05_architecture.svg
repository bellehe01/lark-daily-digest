<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A7CFF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glowEngine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#8A7CFF" flood-opacity="0.35"/>
    </filter>
    <marker id="arrFlow" orient="auto" markerWidth="9" markerHeight="9" viewBox="0 0 9 9" refX="8" refY="4.5">
      <polygon points="0,0 9,4.5 0,9" fill="#4A6EA8"/>
    </marker>
  </defs>

  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220"/>
  <text id="deco-num" data-pptx-role="decoration" x="1200" y="188" font-size="150" font-weight="bold" text-anchor="end" fill="#FFFFFF" fill-opacity="0.04">04</text>

  <g id="header" data-pptx-bounds="80 56 860 108">
    <rect x="80" y="74" width="4" height="12" rx="2" fill="#8A7CFF"/>
    <rect x="88" y="68" width="4" height="18" rx="2" fill="#5E8DF5"/>
    <rect x="96" y="78" width="4" height="8" rx="2" fill="#38BDF8"/>
    <text x="110" y="88" font-size="15" letter-spacing="3" fill="#8A7CFF">04 · 架构 SYSTEM PIPELINE</text>
    <text x="80" y="140" font-size="40" font-weight="bold" fill="#E9EFFB">三层流水线:信号进,洞察出</text>
  </g>

  <g id="col-labels" data-pptx-bounds="80 190 1120 30">
    <text x="80" y="212" font-size="14" letter-spacing="2" fill="#64789E">输入 · SOURCES</text>
    <text x="640" y="212" font-size="14" letter-spacing="2" text-anchor="middle" fill="#64789E">分析 · ENGINE</text>
    <text x="1200" y="212" font-size="14" letter-spacing="2" text-anchor="end" fill="#64789E">输出 · OUTPUTS</text>
  </g>

  <g id="src-chats" data-pptx-bounds="80 240 300 110">
    <rect x="80" y="240" width="300" height="110" rx="12" fill="#131C2E" stroke="#263A5E" stroke-width="1"/>
    <use data-icon="tabler-outline/message-circle" x="104" y="262" width="32" height="32" fill="#38BDF8"/>
    <text x="152" y="286" font-size="22" font-weight="bold" fill="#E9EFFB">飞书群聊</text>
    <text x="104" y="328" font-size="16" fill="#64789E">消息 · 决策请求 · @我</text>
  </g>

  <g id="src-platform" data-pptx-bounds="80 380 300 110">
    <rect x="80" y="380" width="300" height="110" rx="12" fill="#131C2E" stroke="#263A5E" stroke-width="1"/>
    <use data-icon="tabler-outline/database" x="104" y="402" width="32" height="32" fill="#38BDF8"/>
    <text x="152" y="426" font-size="22" font-weight="bold" fill="#E9EFFB">平台后台</text>
    <text x="104" y="468" font-size="16" fill="#64789E">播放 · 涨粉 · 收入</text>
  </g>

  <g id="src-calendar" data-pptx-bounds="80 520 300 110">
    <rect x="80" y="520" width="300" height="110" rx="12" fill="#131C2E" stroke="#263A5E" stroke-width="1"/>
    <use data-icon="tabler-outline/calendar-event" x="104" y="542" width="32" height="32" fill="#38BDF8"/>
    <text x="152" y="566" font-size="22" font-weight="bold" fill="#E9EFFB">发行日历</text>
    <text x="104" y="608" font-size="16" fill="#64789E">节点 · 截止日 · 里程碑</text>
  </g>

  <g id="edges-in" data-pptx-bounds="384 250 102 320">
    <line x1="388" y1="295" x2="482" y2="345" stroke="#4A6EA8" stroke-width="2" marker-end="url(#arrFlow)"/>
    <line x1="388" y1="435" x2="482" y2="435" stroke="#4A6EA8" stroke-width="2" marker-end="url(#arrFlow)"/>
    <line x1="388" y1="575" x2="482" y2="525" stroke="#4A6EA8" stroke-width="2" marker-end="url(#arrFlow)"/>
  </g>

  <g id="engine" data-pptx-bounds="490 250 300 380">
    <rect x="490" y="250" width="300" height="380" rx="16" fill="#101828" stroke="#8A7CFF" stroke-width="1.5" filter="url(#glowEngine)"/>
    <use data-icon="simple-icons/claude" x="618" y="282" width="44" height="44" fill="#D97757"/>
    <text x="640" y="368" font-size="26" font-weight="bold" text-anchor="middle" fill="#E9EFFB">Claude 分析引擎</text>
    <rect x="530" y="392" width="220" height="1" fill="#263A5E"/>
    <text x="640" y="432" font-size="18" text-anchor="middle" fill="#9AA9C7">汇总归并 · 语义理解</text>
    <g id="engine-triage">
      <circle cx="560" cy="472" r="7" fill="#F87171"/>
      <circle cx="584" cy="472" r="7" fill="#FBBF24"/>
      <circle cx="608" cy="472" r="7" fill="#34D399"/>
      <text x="632" y="479" font-size="18" fill="#9AA9C7">红黄绿三级分诊</text>
    </g>
    <text x="640" y="526" font-size="18" text-anchor="middle" fill="#9AA9C7">生成跟进建议</text>
    <text x="640" y="592" font-size="14" letter-spacing="2" text-anchor="middle" fill="#4A5D80">ONE CALL · ALL SIGNALS</text>
  </g>

  <g id="edges-out" data-pptx-bounds="794 250 102 320">
    <line x1="798" y1="345" x2="892" y2="295" stroke="#4A6EA8" stroke-width="2" marker-end="url(#arrFlow)"/>
    <line x1="798" y1="435" x2="892" y2="435" stroke="#4A6EA8" stroke-width="2" marker-end="url(#arrFlow)"/>
    <line x1="798" y1="525" x2="892" y2="575" stroke="#4A6EA8" stroke-width="2" marker-end="url(#arrFlow)"/>
  </g>

  <g id="out-digest" data-pptx-bounds="900 240 300 110">
    <rect x="900" y="240" width="300" height="110" rx="12" fill="#131C2E" stroke="#263A5E" stroke-width="1"/>
    <use data-icon="tabler-outline/report" x="924" y="262" width="32" height="32" fill="#34D399"/>
    <text x="972" y="286" font-size="22" font-weight="bold" fill="#E9EFFB">晨报卡片</text>
    <text x="924" y="328" font-size="16" fill="#64789E">每天 08:45 推送到飞书</text>
