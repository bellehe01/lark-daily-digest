<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="content" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="gradSpine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A7CFF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220"/>
  <text id="deco-num" data-pptx-role="decoration" x="1200" y="188" font-size="150" font-weight="bold" text-anchor="end" fill="#FFFFFF" fill-opacity="0.04">05</text>

  <g id="header" data-pptx-bounds="80 56 860 108">
    <rect x="80" y="74" width="4" height="12" rx="2" fill="#8A7CFF"/>
    <rect x="88" y="68" width="4" height="18" rx="2" fill="#5E8DF5"/>
    <rect x="96" y="78" width="4" height="8" rx="2" fill="#38BDF8"/>
    <text x="110" y="88" font-size="15" letter-spacing="3" fill="#8A7CFF">05 · 功能二 RELEASE RADAR</text>
    <text x="80" y="140" font-size="40" font-weight="bold" fill="#E9EFFB">发行排期:一条时间轴盯全程</text>
  </g>

  <g id="release-timeline" data-pptx-bounds="60 210 1160 330">
    <rect x="100" y="388" width="1080" height="4" rx="2" fill="url(#gradSpine)"/>
    <polygon points="1180,378 1198,390 1180,402" fill="#38BDF8"/>

    <g id="stage-demo">
      <use data-icon="tabler-outline/playlist" x="143" y="252" width="34" height="34" fill="#8A7CFF"/>
      <text x="160" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#E9EFFB">收歌评估</text>
      <circle cx="160" cy="390" r="10" fill="#0B1220" stroke="#8A7CFF" stroke-width="2.5"/>
      <text x="160" y="442" font-size="15" letter-spacing="2" text-anchor="middle" fill="#64789E">T-30</text>
      <text x="160" y="478" font-size="16" text-anchor="middle" fill="#9AA9C7">demo 试听 · 意向确认</text>
    </g>
    <g id="stage-schedule">
      <use data-icon="tabler-outline/calendar-event" x="383" y="252" width="34" height="34" fill="#7D8DF9"/>
      <text x="400" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#E9EFFB">定档</text>
      <circle cx="400" cy="390" r="10" fill="#0B1220" stroke="#7D8DF9" stroke-width="2.5"/>
      <text x="400" y="442" font-size="15" letter-spacing="2" text-anchor="middle" fill="#64789E">T-14</text>
      <text x="400" y="478" font-size="16" text-anchor="middle" fill="#9AA9C7">档期锁定 · 平台报备</text>
    </g>
    <g id="stage-assets">
      <use data-icon="tabler-outline/wand" x="623" y="252" width="34" height="34" fill="#6BA4F5"/>
      <text x="640" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#E9EFFB">物料筹备</text>
      <circle cx="640" cy="390" r="10" fill="#0B1220" stroke="#6BA4F5" stroke-width="2.5"/>
      <text x="640" y="442" font-size="15" letter-spacing="2" text-anchor="middle" fill="#64789E">T-7</text>
      <text x="640" y="478" font-size="16" text-anchor="middle" fill="#9AA9C7">封面 · 文案 · 视频切片</text>
    </g>
    <g id="stage-launch">
      <use data-icon="tabler-outline/rocket" x="863" y="252" width="34" height="34" fill="#54B2F0"/>
      <text x="880" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#E9EFFB">上线宣发</text>
      <circle cx="880" cy="390" r="10" fill="#0B1220" stroke="#54B2F0" stroke-width="2.5"/>
      <text x="880" y="442" font-size="15" letter-spacing="2" text-anchor="middle" fill="#64789E">T-0</text>
      <text x="880" y="478" font-size="16" text-anchor="middle" fill="#9AA9C7">全渠道发布 · 首日冲刺</text>
    </g>
    <g id="stage-review">
      <use data-icon="tabler-outline/chart-line" x="1103" y="252" width="34" height="34" fill="#38BDF8"/>
      <text x="1120" y="336" font-size="22" font-weight="bold" text-anchor="middle" fill="#E9EFFB">数据复盘</text>
      <circle cx="1120" cy="390" r="10" fill="#0B1220" stroke="#38BDF8" stroke-width="2.5"/>
      <text x="1120" y="442" font-size="15" letter-spacing="2" text-anchor="middle" fill="#64789E">T+7</text>
      <text x="1120" y="478" font-size="16" text-anchor="middle" fill="#9AA9C7">首周战报 · 策略迭代</text>
    </g>
  </g>

  <g id="reminder-strip" data-pptx-bounds="80 560 1120 76">
    <rect x="80" y="560" width="1120" height="76" rx="14" fill="#101828" stroke="#2E4468" stroke-width="1"/>
    <use data-icon="tabler-outline/clock" x="116" y="582" width="30" height="30" fill="#FBBF24"/>
    <text x="168" y="606" font-size="19" fill="#9AA9C7">节点自动提醒:临期未完成自动升级为红色预警,直接推送到对应项目群。</text>
  </g>

  <g id="footer" data-pptx-bounds="80 664 1120 40">
    <text x="80" y="690" font-size="13" letter-spacing="3" fill="#3E5174">MUSIC CREATOR MANAGER</text>
    <text x="1200" y="690" font-size="13" letter-spacing="2" text-anchor="end" fill="#3E5174">07 / 11</text>
  </g>
</svg>
