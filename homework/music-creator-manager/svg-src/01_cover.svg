  </defs>

  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0B1220"/>
  <circle id="deco-orb" data-pptx-role="decoration" cx="1020" cy="360" r="300" fill="url(#gradOrb)"/>
  <path id="deco-grid" data-pptx-role="decoration" d="M80 96H1200 M80 640H1200" stroke="#263A5E" stroke-width="1" stroke-opacity="0.55" fill="none"/>
  <path id="deco-dots" data-pptx-role="decoration" fill="none" stroke="#38BDF8" stroke-opacity="0.14" stroke-width="1" d="M120 150V158 M150 150V158 M180 150V158 M210 150V158 M240 150V158 M270 150V158 M300 150V158"/>

  <g id="header-tag" data-pptx-bounds="80 108 700 40">
