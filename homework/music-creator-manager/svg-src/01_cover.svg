    <text x="76" y="446" font-size="72" font-weight="bold" fill="url(#gradAccent)">AI 工作台</text>
    <rect x="80" y="478" width="120" height="4" rx="2" fill="url(#gradAccent)"/>
  </g>

  <g id="subtitle-block" data-pptx-bounds="80 500 700 60">
