  </g>

  <g id="meta-block" data-pptx-bounds="80 586 700 70">
    <text x="80" y="614" font-size="17" fill="#64789E">belle · 音乐创作者运营</text>
    <text x="80" y="642" font-size="15" letter-spacing="2" fill="#4A5D80">2026.08 · SKILL: HUGOHE / PPT-MASTER</text>
  </g>

  <g id="hero-wave" data-pptx-bounds="850 210 360 370">
