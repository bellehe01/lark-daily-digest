<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-page-role="cover" font-family="Noto Sans CJK SC">
  <defs>
    <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8A7CFF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gradBarV" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8A7CFF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="gradOrb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8A7CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8A7CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowTitle" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#8A7CFF" flood-opacity="0.40"/>
    </filter>
    <filter id="glowBar" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38BDF8" flood-opacity="0.45"/>
