    <circle cx="1030" cy="368" r="112" fill="none" stroke="#2E4468" stroke-width="1" stroke-dasharray="4,4"/>
    <g id="hero-wave-bars">
      <rect x="952" y="332" width="12" height="72" rx="6" fill="url(#gradBarV)" fill-opacity="0.55"/>
      <rect x="976" y="308" width="12" height="120" rx="6" fill="url(#gradBarV)" fill-opacity="0.75"/>
      <rect x="1000" y="284" width="12" height="168" rx="6" fill="url(#gradBarV)"/>
      <rect x="1024" y="258" width="12" height="220" rx="6" fill="url(#gradBarV)" filter="url(#glowBar)"/>
      <rect x="1048" y="284" width="12" height="168" rx="6" fill="url(#gradBarV)"/>
      <rect x="1072" y="308" width="12" height="120" rx="6" fill="url(#gradBarV)" fill-opacity="0.75"/>
      <rect x="1096" y="332" width="12" height="72" rx="6" fill="url(#gradBarV)" fill-opacity="0.55"/>
